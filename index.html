        /* DECORACIONES LATERALES FLOTANTES */

            bottom: 0;

            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;

        body::before {

            position: fixed;
            top: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212, 163, 115, 0.18) 0%, rgba(251, 249, 245, 0) 70%);

            pointer-events: none;

        body::after {

            right: -100px;

            justify-content: center; 
            margin-bottom: 2.5rem;

        }
        
        .search-wrapper {

            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 999px;
            border: 1px solid rgba(212, 163, 115, 0.25);

            box-shadow: 0 20px 45px -8px rgba(212, 163, 115, 0.25), 0 0 0 3px rgba(212, 163, 115, 0.12);

            justify-content: center;

            height: 28px;
            border-radius: 50%;
            font-size: 0.85rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;

            background-color: var(--primary);
            color: #fff;

            background-color: #c29162;

        .card-body { padding: 1.4rem; display: flex; flex-direction: column; flex-grow: 1; }

        .card-precio { font-size: 1.15rem; font-weight: 700; color: var(--text-dark); font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.3px; }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }

</head>

        function renderizarProductos(productosAMostrar) {
            const grid = document.getElementById('gridProductos');
            grid.innerHTML = '';
            
            if (productosAMostrar.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: #777; padding: 2rem;">No se encontraron productos.</p>`;
                return;
            }

            productosAMostrar.forEach((p, index) => {
                const indexOriginal = productos.indexOf(p);
                const delay = index * 0.04;
                grid.innerHTML += `
                    <div class="card" style="animation-delay: ${delay}s;" onclick="abrirModal(${indexOriginal})">
                        ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
                        <div class="img-container"><img src="${p.fotos[0]}" alt="${p.titulo}"></div>
                        <div class="card-body">
                            <span class="card-categoria">${p.categoria}</span>
                            <h2 class="card-titulo">${p.titulo}</h2>
                            <p class="card-descripcion">${p.descripcion}</p>
                            <div class="card-footer"><span class="card-precio">${p.precio}</span><button class="btn-ver">Ver detalle</button></div>
                        </div>
                    </div>
                `;
            });
        }

        function filtrarProductos() {
            const texto = document.getElementById('searchInput').value.toLowerCase().trim();
            aplicarFiltros(texto, categoriaActiva);
        }

        function limpiarBuscador() {
            const input = document.getElementById('searchInput');
            input.value = '';
            filtrarProductos();
            input.focus();
        }

        function filtrarPorCategoria(cat, elemento) {
            categoriaActiva = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
            
            const texto = document.getElementById('searchInput').value.toLowerCase().trim();
            aplicarFiltros(texto, categoriaActiva);
        }

        function aplicarFiltros(texto, categoria) {
            const filtrados = productos.filter(p => {
                const coincideTexto = p.titulo.toLowerCase().includes(texto) || 
                                      p.categoria.toLowerCase().includes(texto) || 
                                      p.descripcion.toLowerCase().includes(texto);
                const coincideCat = (categoria === "Todos" || p.categoria === categoria);
                return coincideTexto && coincideCat;
            });
            renderizarProductos(filtrados);
        }

        function abrirModal(index) {
            const p = productos[index];
            document.getElementById('modalCategoria').innerText = p.categoria;
            document.getElementById('modalTitulo').innerText = p.titulo;
            document.getElementById('modalPrecio').innerText = p.precio;
            document.getElementById('modalDetalles').innerText = p.detalles;
            document.getElementById('mainImg').src = p.fotos[0];
            
            const thumbs = document.getElementById('thumbsContainer');
            thumbs.innerHTML = '';
            
            if(p.fotos.length > 1) {
                p.fotos.forEach((f, i) => {
                    const img = document.createElement('img');
                    img.src = f; 
                    img.className = 'thumb-img' + (i === 0 ? ' active' : '');
                    img.onclick = () => { 
                        document.getElementById('mainImg').src = f; 
                        document.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active')); 
                        img.classList.add('active'); 
                    };
                    thumbs.appendChild(img);
                });
            }
            
            const mensaje = encodeURIComponent(`Hola! Me interesa ${p.titulo} de ${p.precio}`);
            document.getElementById('modalBtnWhatsapp').href = `https://wa.me/${NUMERO_WHATSAPP}?text=${mensaje}`;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function cerrarModal() { document.getElementById('modalOverlay').classList.remove('active'); }
        function cerrarModalAfuera(e) { if (e.target.id === 'modalOverlay') cerrarModal(); }

        renderizarProductos(productos);
    </script>
